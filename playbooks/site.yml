---
# ============================================================
# Основной плейбук развёртывания HA-кластера PostgreSQL
# ============================================================
# Разворачивает на одних и тех же хостах (группа cluster):
#   1) etcd — распределённое хранилище (DCS для Patroni)
#   2) PostgreSQL — СУБД (без запуска сервиса, только установка)
#   3) Patroni — менеджер отказоустойчивости, запускающий PostgreSQL
#
# Порядок важен: etcd → PostgreSQL → Patroni.
# Patroni при старте обращается к etcd и запускает postgres,
# поэтому etcd должен быть готов раньше.

# ------------------------------------------------------------
# 1. Установка etcd
# ------------------------------------------------------------
# На всех узлах группы etcd (наследует cluster).
# Роль ставит бинарники, конфиг, systemd-юнит и запускает сервис.
# Узлы образуют кластер etcd с общим initial-cluster-token.
- name: Установка etcd cluster
  hosts: etcd
  roles:
    - etcd

# ------------------------------------------------------------
# 2. Установка PostgreSQL (без запуска сервиса)
# ------------------------------------------------------------
# На всех узлах группы postgresql (наследует cluster).
# Роль ставит пакеты из PGDG, готовит data-dir и pg_hba.conf,
# но НЕ запускает postgresql.service — запуском займётся Patroni.
# Системный сервис postgresql отключается.
- name: Установка PostgreSQL
  hosts: postgresql
  roles:
    - postgresql

# ------------------------------------------------------------
# 3. Установка Patroni
# ------------------------------------------------------------
# На всех узлах группы patroni (наследует cluster).
# Роль создаёт venv, ставит patroni[etcd] и psycopg2-binary,
# кладёт patroni.yml и systemd-юнит, запускает patroni.service.
# Patroni подключается к etcd, выбирает лидера и запускает postgres.
- name: Установка Patroni
  hosts: patroni
  roles:
    - patroni
