# ============================================================
# Секция [defaults] — основные настройки Ansible
# ============================================================
[defaults]

# Путь к файлу инвентаря (список хостов и групп)
# Может быть как относительным, так и абсолютным
inventory = inventory.ini

# Каталог, в котором Ansible ищет роли
# Позволяет вызывать роли по короткому имени (например, role: etcd)
roles_path = roles/

# Отключает проверку SSH-ключа хоста (host key checking)
# False — удобно для лаб/тестов, но небезопасно в проде (MITM-атаки)
host_key_checking = False

# Отключает создание файлов .retry при неудачных запусках плейбука
# Такие файлы позволяют перезапустить только упавшие хосты
retry_files_enabled = False

# Формат вывода в консоль
# yaml — структурированный и читаемый вывод (альтернативы: json, minimal, oneline)
stdout_callback = yaml

# Отключает предупреждения об устаревших функциях/синтаксисе
deprecation_warnings = False

# Автоматически определяет путь к Python-интерпретатору на целевом хосте
# Полезно, когда на разных хостах разные версии Python
interpreter_python = auto

# Количество параллельных процессов (форков) для выполнения задач
# 5 — умеренное значение; больше = быстрее, но выше нагрузка
forks = 5

# Таймаут (в секундах) на подключение по SSH и выполнение операций
timeout = 10


# ============================================================
# Секция [privilege_escalation] — повышение привилегий
# ============================================================
[privilege_escalation]

# Включает повышение привилегий (аналог sudo) для задач
become = True

# Метод повышения привилегий: sudo / su / pbrun / pfexec / doas и т.д.
become_method = sudo

# Пользователь, в которого "превращаемся" при повышении привилегий
become_user = root

# Запрашивать ли пароль для sudo
# False — если настроен passwordless sudo (NOPASSWD в /etc/sudoers)
become_ask_pass = False


# ============================================================
# Секция [ssh_connection] — параметры SSH-подключения
# ============================================================
[ssh_connection]

# SSH pipelining — уменьшает количество SSH-соединений
# Ускоряет выполнение, но требует отключённого requiretty в sudoers на целевых хостах
pipelining = True