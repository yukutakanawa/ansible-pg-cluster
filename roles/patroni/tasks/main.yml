---
# Плейбук: установка и настройка Patroni
# Ставит venv, кладёт конфиг и systemd-юнит, запускает сервис.
- name: Установка окружения Patroni
  become: true
  block:
    # Подгрузка переменных по ОС.
    # Для RedHat берётся файл Rocky.yml (пути RHEL-семейства),
    # для Debian — Debian.yml.
    - name: Загрузка переменных по ОС
      ansible.builtin.include_vars:
        file: "{{ 'Rocky' if ansible_facts['os_family'] == 'RedHat' else ansible_facts['os_family'] }}.yml"
      when: ansible_facts['os_family'] in ['Debian', 'RedHat']

    # Системные пакеты для работы venv:
    # python3-venv + python3-pip на Debian, python3-pip на Rocky.
    - name: Установка пакетов для venv
      ansible.builtin.package:
        name: "{{ venv_packages }}"
        state: present

    # Каталог под venv Patroni (/opt/patroni/venv).
    - name: Создание директории для Patroni
      ansible.builtin.file:
        path: "{{ patroni_venv_path }}"
        state: directory
        owner: "{{ patroni_user }}"
        group: "{{ patroni_group }}"
        mode: "0755"

    # Создание venv и установка patroni[etcd] + psycopg2-binary.
    - name: Создаем venv и устанавливаем pip-пакеты
      ansible.builtin.pip:
        name: "{{ patroni_pip_packages }}"
        virtualenv: "{{ patroni_venv_path }}"
        virtualenv_command: python3 -m venv
        state: present

    # Каталог конфигов /etc/patroni.
    - name: Создание конфига
      ansible.builtin.file:
        path: "{{ patroni_config_dir }}"
        state: directory
        owner: root
        group: "{{ patroni_group }}"
        mode: "0750"

    # Каталог логов /var/log/patroni.
    - name: Создание файлов с логами
      ansible.builtin.file:
        path: "{{ patroni_log_dir }}"
        state: directory
        owner: root
        group: "{{ patroni_group }}"
        mode: "0750"

    - name: Создать post_bootstrap.sh
      ansible.builtin.template:
        src: post_bootstrap.sh.j2
        dest: /etc/patroni/post_bootstrap.sh
        owner: postgres
        group: postgres
        mode: "0700"

    - name: Создать conf.d (для RHEL)
      ansible.builtin.file:
        path: "{{ pg_data_dir }}/conf.d"
        state: directory
        owner: "{{ postgresql_user }}"
        group: "{{ postgresql_group }}"
        mode: "0700"
      when: ansible_os_family == "RedHat"

    # Отключение SELinux (RHEL) — иначе SELinux блокирует доступ
    # к SSL-ключу, даже если права Linux корректные.
    - name: Отключить SELinux (RHEL)
      ansible.posix.selinux:
        state: permissive
        policy: targeted
      when: ansible_os_family == "RedHat"
      failed_when: false

    # Каталог /etc/ssl/private для self-signed сертификата.
    # Владелец root, группа postgres, 0750 — чтобы postgres мог зайти
    # в каталог и прочитать ключ, но никто другой — нет.
    - name: Создать /etc/ssl/private (RHEL)
      ansible.builtin.file:
        path: /etc/ssl/private
        state: directory
        owner: root
        group: postgres
        mode: "0750"
      when: ansible_os_family == "RedHat"

    # Self-signed сертификат для PostgreSQL.
    # PostgreSQL в Debian-пакете использует ssl-cert-snakeoil;
    # на RHEL его нет — создаём сами.
    - name: Создать SSL-сертификат для PostgreSQL (RHEL)
      ansible.builtin.command:
        cmd: >
          openssl req -new -x509 -days 3650 -nodes
          -out /etc/ssl/certs/ssl-cert-snakeoil.pem
          -keyout /etc/ssl/private/ssl-cert-snakeoil.key
          -subj "/CN={{ ansible_hostname }}"
        creates: /etc/ssl/certs/ssl-cert-snakeoil.pem
      when: ansible_os_family == "RedHat"

    # Права на SSL-файлы: ключ принадлежит postgres (0600),
    # сертификат — root (0644).
    - name: Права на SSL-файлы (RHEL)
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "/etc/ssl/certs/ssl-cert-snakeoil.pem", owner: "root", group: "root", mode: "0644" }
        - { path: "/etc/ssl/private/ssl-cert-snakeoil.key", owner: "postgres", group: "postgres", mode: "0600" }
      when: ansible_os_family == "RedHat"

    # Рендер основного конфига Patroni.
    - name: Сгенерировать конфиг patroni.yml
      ansible.builtin.template:
        src: patroni.yml.j2
        dest: "{{ patroni_config_file }}"
        owner: root
        group: "{{ patroni_group }}"
        mode: "0640"
      notify:
        - Restart patroni

    # Systemd-юнит Patroni.
    - name: Сгенерировать systemd-юнит patroni.service
      ansible.builtin.template:
        src: patroni.service.j2
        dest: /etc/systemd/system/patroni.service
        owner: root
        mode: "0644"
      notify:
        - Restart patroni
        - Reload systemd

    # Запуск и включение в автозагрузку.
    - name: Запуск patroni.service
      ansible.builtin.systemd:
        name: "{{ patroni_service_name }}"
        state: started
        enabled: true
        daemon-reload: true
