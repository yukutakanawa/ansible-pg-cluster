---
# Метаданные роли Ansible Galaxy
# Файл meta/main.yml — описывает роль: авторство, совместимость, зависимости
# Используется при публикации в Ansible Galaxy и при установке роли через ansible-galaxy

galaxy_info:
  # Автор роли (отображается на странице Galaxy)
  author: Nick Solodilov

  # Краткое описание назначения роли
  description: Установка и настройка узла кластера etcd

  # Лицензия роли (важно для корпоративного использования)
  # MIT — разрешительная, позволяет использовать в проприетарных проектах
  license: MIT

  # Минимальная версия Ansible, необходимая для работы роли
  # Указывается строкой (иначе YAML может интерпретировать как float)
  # 2.21 — очень свежая версия; для совместимости со старыми системами
  # часто указывают 2.9+ или 2.10+ (коллекции)
  min_ansible_version: "2.21"

  # Поддерживаемые платформы и их версии
  # Ansible проверяет эти значения при запуске роли (если не отключено)
  platforms:
    # Debian 12 (bookworm) — стабильный LTS-релиз
    - name: Debian
      versions:
        - bookworm

    # Ubuntu 22.04 LTS (jammy) и 24.04 LTS (noble) — LTS-релизы
    - name: Ubuntu
      versions:
        - jammy
        - noble

    # Enterprise Linux 9 (RHEL 9, Rocky Linux 9, AlmaLinux 9)
    # "9" в кавычках — чтобы YAML не превратил в число
    - name: EL
      versions:
        - "9"

  # Теги для поиска роли в Ansible Galaxy
  # Помогают другим пользователям найти роль по ключевым словам
  galaxy_tags:
    - etcd # основной компонент
    - cluster # кластерная работа
    - high-availability # отказоустойчивость

# Зависимости роли — другие роли из Galaxy, которые будут установлены
# автоматически перед этой ролью
# Пустой список означает, что роль самодостаточна
# Пример с зависимостями:
# dependencies:
#   - role: geerlingguy.repo-epel       # подключение EPEL-репозитория
#   - role: robertdebock.ca_certificates # установка CA-сертификатов
dependencies: []
