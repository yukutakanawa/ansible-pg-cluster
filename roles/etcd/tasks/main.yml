---
- name: "Настройка окружения и установка etcd"
  become: true
  block:
    - name: "Создание группы etcd"
      ansible.builtin.group:
        name: "{{ etcd_group }}"
        state: present
        system: yes
      
    - name: "Создание пользователя etcd (системного)"
      ansible.builtin.user:
        name: "{{ etcd_user }}"
        shell: "/usr/sbin/nologin"
        system: yes
        home: "{{ etcd_data_dir }}"
        create_home: no
        group: "{{ etcd_group }}"    

    - name: "Скачивание архива с etcd"
      ansible.builtin.get_url:
        url: "{{ etcd_download_url }}"
        mode: "0644"
        dest: /tmp/etcd-{{ etcd_version }}-linux-{{ etcd_arch }}.tar.gz
        force: no

    - name: "Распаковка архива"
      ansible.builtin.unarchive:
        src: /tmp/etcd-{{ etcd_version }}-linux-{{ etcd_arch }}.tar.gz
        dest: /tmp/etcd-extract
        remote_src: yes

    - name: "Скопировать бинарники в /usr/local/bin"
      ansible.builtin.copy:
        src: "/tmp/etcd-extract/etcd-v{{ etcd_version }}-linux-{{ etcd_arch }}/{{ item }}"
        dest: "{{ etcd_binary }}/{{ item }}"
        mode: "0755"
        owner: root
        group: root
        remote_src: yes
      loop:
        - "etcd"
        - "etcdctl"

    - name: "Создать директорию конфигов /etc/etcd"
      ansible.builtin.file:
        state: directory
        path: "{{ etcd_config_dir }}"
        owner: root
        group: "{{ etcd_group }}"
        mode: "0750"

    - name: "Создать data-dir /var/lib/etcd"
      ansible.builtin.file:
        state: directory
        path: "{{ etcd_data_dir }}"
        owner: "{{ etcd_user }}"
        group: "{{ etcd_group }}"
        mode: "0700" 

    - name: "Сгенерировать конфиг /etc/etcd/etcd.conf.yml"
      ansible.builtin.template:
        src: etcd.conf.yml.j2
        dest: "{{ etcd_config_file }}"
        owner: root
        group: root
        mode: "0640"
      notify: Restart etcd

    - name: "Сгенерировать systemd-юнит /etc/systemd/system/etcd.service"
      ansible.builtin.template:
        src: etcd.service.j2
        dest: "{{ etcd_systemd_unit_file }}"
        owner: root
        group: root
        mode: "0644"
      notify: 
        - Reload systemd
        - Restart etcd
        
    - name: "Запустить и enable сервис"
      ansible.builtin.systemd:
        name: "{{ etcd_systemd_service }}"
        state: started
        enable: yes
        daemon-reload: yes

    - name: "Удаление файлов"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/etcd-{{ etcd_version }}-linux-{{ etcd_arch }}.tar.gz
        - /tmp/etcd-extract
      