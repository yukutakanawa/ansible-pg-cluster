# === Группа кластера ===
# Содержит все узлы, входящие в кластер (должны быть в /etc/hosts или DNS)
[cluster]
ubuntu
debian
rocky

# === Группа etcd ===
# Дочерняя группа: наследует всех хостов из [cluster]
# Используется для установки и настройки etcd на всех узлах кластера
[etcd:children]
cluster

# === Группа postgresql ===
# Дочерняя группа: наследует всех хостов из [cluster]
# Используется для установки и настройки PostgreSQL на всех узлах кластера
[postgresql:children]
cluster

# === Группа patroni ===
# Дочерняя группа: наследует всех хостов из [cluster]
# Используется для установки и настройки Patroni (менеджер отказоустойчивости PostgreSQL)
[patroni:children]
cluster